name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
# Uncomment the following lines to enable scheduled checks for updates
  schedule:
    - cron: '0 * * * *' 
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

   
    # Check if the official image is newer than your own
    - name: Check for upstream updates
      id: check
      run: |
        OFFICIAL_IMAGE="windroseserver/windroseserver"
        MY_IMAGE="nodiaque/windrose"
        TAG="latest-test"
        
        # Get the date when the official image was last updated
        OFFICIAL_URL="https://hub.docker.com/v2/repositories/${OFFICIAL_IMAGE}/tags/${TAG}"
        OFFICIAL_DATE=$(curl -s "$OFFICIAL_URL" | jq -r '.last_updated')
        
        # Get the date when YOUR image was last updated
        MY_URL="https://hub.docker.com/v2/repositories/${MY_IMAGE}/tags/${TAG}"
        MY_DATE=$(curl -s "$MY_URL" | jq -r '.last_updated // "never"')
        
        echo "Official image last updated: $OFFICIAL_DATE"
        echo "My image last updated: $MY_DATE"

        # If for unknown reason can't fetch original image, abort
        if [ $OFFICIAL_DATE = null ]; then
          echo "Source is null, aborting"
          echo "needs_update=false" >> $GITHUB_OUTPUT
        else
         # If your image has never been built, or the official one is newer: Set 'needs_update' to true
          if [ "$MY_DATE" = "never" ] || [ "$(date -d "$OFFICIAL_DATE" +%s)" -gt "$(date -d "$MY_DATE" +%s)" ]; then
            echo "New update found! Starting build..."
            echo "needs_update=true" >> $GITHUB_OUTPUT
            
            RESPONSE=$(curl -s "https://hub.docker.com/v2/repositories/${OFFICIAL_IMAGE}/tags/?page_size=10")
  
            LATEST_DIGEST=$(echo "$RESPONSE" | jq -r '.results[] | select(.name=="latest") | .digest')
            VERSION=$(echo "$RESPONSE" | jq -r --arg d "$LATEST_DIGEST" '.results[] | select(.digest==$d and .name!="latest") | .name' | head -n1)
  
            echo "Latest version: $VERSION"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "No new updates. Aborting."
            echo "needs_update=false" >> $GITHUB_OUTPUT
          fi
        fi
       
      
    - name: Set up Docker Buildx
      if: steps.check.outputs.needs_update == 'true'
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      if: steps.check.outputs.needs_update == 'true'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      if: steps.check.outputs.needs_update == 'true'
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: true
        pull: true
        no-cache: true
        tags: |
          nodiaque/windrose:${{ steps.check.outputs.version }}
          nodiaque/windrose:latest
